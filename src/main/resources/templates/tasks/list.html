<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task List — Task Planner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="topbar">
    <a class="brand" href="/tasks/week">Task Planner</a>
    <div class="nav-links">
        <a href="/tasks/week">Week</a>
        <a href="/tasks" class="active">List</a>
        <a href="/tasks/new" class="primary">+ New Task</a>
    </div>
</div>

<div class="container">
    <h1>Task List</h1>
    <p class="task-count" th:unless="${#lists.isEmpty(tasks)}"
       th:text="|${totalCount} tasks · ${completedCount} completed|"></p>

    <form class="toolbar" method="get" action="/tasks">
        <div class="pill-group">
            <select name="status" class="filter-select" onchange="this.form.submit()">
                <option value="" th:selected="${status == null}">All tasks</option>
                <option value="active" th:selected="${status == 'active'}">Active</option>
                <option value="completed" th:selected="${status == 'completed'}">Completed</option>
            </select>
            <select name="priority" class="filter-select" onchange="this.form.submit()">
                <option value="" th:selected="${priority == null}">Any priority</option>
                <option value="1" th:selected="${priority != null and priority == 1}">Low</option>
                <option value="2" th:selected="${priority != null and priority == 2}">Medium</option>
                <option value="3" th:selected="${priority != null and priority == 3}">High</option>
            </select>
            <select name="sort" class="filter-select" onchange="this.form.submit()">
                <option value="" th:selected="${sort == null}">No sorting</option>
                <option value="priority" th:selected="${sort == 'priority'}">By priority</option>
                <option value="date" th:selected="${sort == 'date'}">By date</option>
            </select>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(tasks)}" class="empty-state">
        No tasks yet. <a href="/tasks/new">Create the first one</a>
    </div>

    <div class="task-list" th:unless="${#lists.isEmpty(tasks)}">
        <div class="task-row" th:each="task : ${tasks}"
             th:classappend="${task.completed ? 'completed' : (task.date.isBefore(today) ? 'overdue' : '')}">
            <div class="task-main">
                <p class="task-title" th:text="${task.title}"></p>
                <p class="task-desc" th:if="${task.description != null and !task.description.isEmpty()}" th:text="${task.description}"></p>
            </div>
            <div class="task-date" th:text="${#temporals.format(task.date, 'd MMMM yyyy')}"></div>
            <span class="badge" th:classappend="${'badge-priority-' + task.priority}" th:switch="${task.priority}">
                <th:block th:case="3">High</th:block>
                <th:block th:case="2">Medium</th:block>
                <th:block th:case="*">Low</th:block>
            </span>
            <span class="badge badge-recurring" th:if="${task.recursiveType != -1}"
                  th:text="${task.recursiveType == 1 ? '🔁 Daily' : '🔁 Weekly'}"></span>
            <span class="badge badge-done" th:if="${task.completed}">Completed</span>
            <div class="task-actions">
                <a class="btn" th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a>
                <form th:if="${!task.completed}" th:action="@{/tasks/{id}/complete(id=${task.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-success">Done</button>
                </form>
                <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this task?')">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
