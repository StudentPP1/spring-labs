<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Error</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="error-card">
        <p class="error-code" th:text="${status}"></p>
        <h1 th:text="${title}"></h1>
        <p style="color:var(--text-muted)" th:text="${message}"></p>
        <p style="margin-top:24px;"><a class="btn btn-primary" href="/tasks">← Back to task list</a></p>
    </div>
</div>
</body>
</html>
